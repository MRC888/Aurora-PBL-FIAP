name: Atualizar PDF Aurora
on:
  push:
    paths:
      - ".github/workflows/atualizar-pdf-aurora.yml"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar relatório atualizado
        run: |
          curl -L --fail "https://raw.githubusercontent.com/Douglasgbm/pouso_aurora/main/RELATORIO_FINAL_EQUIPE.pdf" -o "docs/Aurora-2.0.pdf"

      - name: Commitar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm ".github/workflows/atualizar-pdf-aurora.yml"
          git add "docs/Aurora-2.0.pdf" ".github/workflows/atualizar-pdf-aurora.yml"
          git commit -m "docs: atualiza relatório Aurora Fase 2"
          git push
