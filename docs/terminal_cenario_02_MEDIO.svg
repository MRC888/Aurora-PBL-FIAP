<text x="24" y="1580" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="1604" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#d8ad63">Decolagem em espera: existem alertas aguardando a decisão do capitão.</text>
<text x="24" y="1628" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#d8ad63">Deseja seguir com a decolagem? (s/n): s</text>
