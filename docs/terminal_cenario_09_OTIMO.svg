<text x="24" y="1460" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="1484" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">Decolagem Autorizada!</text>
