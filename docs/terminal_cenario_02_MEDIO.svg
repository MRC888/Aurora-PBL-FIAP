<text x="88" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#f5f5f5">python scripts/main.py   -   cenario 02 (MEDIO)</text>
<text x="24" y="92" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="116" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">EXPEDIÇÃO AURORA - CONTROLE DE MISSÃO</text>
<text x="24" y="140" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="164" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Seja bem-vindo a Expedição Aurora.</text>
<text x="24" y="188" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Identifique-se, capitão: Marcelo</text>
<text x="24" y="212" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="236" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Capitão Marcelo, estamos preparando todas as métricas da nave.</text>
<text x="24" y="260" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Para isso precisamos de algumas informações da telemetria.</text>
<text x="24" y="284" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Informe cada valor conforme for pedido. Use ponto para decimais (ex: 22.5).</text>
<text x="24" y="308" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="332" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Digite a temperatura interna: 25</text>
<text x="24" y="356" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Digite a temperatura externa: 30</text>
<text x="24" y="380" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Digite a integridade (1 para Boa, 0 para Comprometida): 1</text>
<text x="24" y="404" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Digite a pressão dos tanques: 550</text>
<text x="24" y="428" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Digite a porcentagem de energia: 80</text>
<text x="24" y="452" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Módulos online? (S/N): S</text>
<text x="24" y="476" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="500" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="524" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">TELEMETRIA INFORMADA</text>
<text x="24" y="548" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="572" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Temperatura interna : 25.0 C</text>
<text x="24" y="596" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Temperatura externa : 30.0 C</text>
<text x="24" y="620" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Integridade         : 1 (Boa)</text>
<text x="24" y="644" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Pressão dos tanques : 550.0 psi</text>
<text x="24" y="668" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Energia             : 80.0 %</text>
<text x="24" y="692" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Módulos online      : SIM</text>
<text x="24" y="716" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="740" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="764" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">ANÁLISE ENERGÉTICA</text>
<text x="24" y="788" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="812" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Capacidade total            : 1000.0 kWh</text>
<text x="24" y="836" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Carga atual                 : 80.0 %</text>
<text x="24" y="860" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Energia disponível          : 800.0 kWh</text>
<text x="24" y="884" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Perdas energéticas          : 8 %</text>
<text x="24" y="908" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Energia perdida             : 64.0 kWh</text>
<text x="24" y="932" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Energia útil                : 736.0 kWh</text>
<text x="24" y="956" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Consumo na decolagem        : 300.0 kWh</text>
<text x="24" y="980" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Energia após a decolagem    : 436.0 kWh (43.6% da bateria)</text>
<text x="24" y="1004" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">  Resultado: energia suficiente para a decolagem.</text>
<text x="24" y="1028" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="1052" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="1076" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">VERIFICAÇÕES DE SEGURANÇA</text>
<text x="24" y="1100" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="1124" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Temperatura Interna: OK</text>
<text x="24" y="1148" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Temperatura Externa: OK</text>
<text x="24" y="1172" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Integridade: Boa</text>
<text x="24" y="1196" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Pressão dos Tanques: OK</text>
<text x="24" y="1220" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Energia: OK</text>
<text x="24" y="1244" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8">Módulos: OK</text>
<text x="24" y="1268" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="1292" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="1316" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">ANÁLISE ASSISTIDA POR IA - DIAGNÓSTICO DE DISCREPÂNCIAS</text>
<text x="24" y="1340" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#62b7e9">==============================================================</text>
<text x="24" y="1364" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="1388" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">ALERTAS (dados válidos, mas em combinação de risco):</text>
<text x="24" y="1412" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#d8ad63">  [!] Energia a 80.0%, no limiar dos 80% exigidos. Não sobra margem para a incerteza do próprio</text>
<text x="24" y="1436" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#d8ad63">  sensor (tipicamente +/- 2%).</text>
<text x="24" y="1460" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#d8ad63">  [!] Pressão de 550 psi opera na fronteira da faixa segura (450 a 550 psi).</text>
<text x="24" y="1484" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>
<text x="24" y="1508" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#d8ad63">&gt;&gt; PARECER: DECOLAGEM VIÁVEL, COM RESSALVAS.</text>
<text x="24" y="1532" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">   2 ponto(s) de atenção acima. Recomenda-se revisão humana.</text>
