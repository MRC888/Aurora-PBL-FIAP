name: Final project cleanup v2

on:
  push:
    branches:
      - fix/final-10-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-10-10
          fetch-depth: 0

      - name: Apply robust final cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # main.py
          p = Path('scripts/main.py')
          text = p.read_text(encoding='utf-8')

          old_header = '''# NAO HA FUNCOES. TODAS AS CONSTANTES ESTAO NO TOPO, E CADA VARIAVEL NASCE
# NA ETAPA EM QUE E USADA PELA PRIMEIRA VEZ. O PAINEL DE VOO (painel.py)
# EXISTE NA PASTA MAS NAO E USADO POR ESTE PROGRAMA.'''
          new_header = '''# NAO HA FUNCOES. TODAS AS CONSTANTES ESTAO NO TOPO, E CADA VARIAVEL NASCE
# NA ETAPA EM QUE E USADA PELA PRIMEIRA VEZ. O PROGRAMA E AUTOSSUFICIENTE:
# ESTE SCRIPT NAO DEPENDE DE ARQUIVOS AUXILIARES PARA EXECUTAR.'''
          text = text.replace(old_header, new_header)

          # Remove any stale parenthetical references to files that no longer exist.
          text = re.sub(r'\s*\(upgrade\.md[^)]*\)', '', text)
          text = re.sub(r'\s*\(analise_assistida_ia\.md\)', '', text)
          text = text.replace('(painel.py)', '')

          old_final = '''if decolagem_autorizada:
    print("Missão em andamento.")
else:
    print("Missão abortada.")'''
          new_final = '''if decolagem_autorizada:
    print("VEREDITO FINAL: PRONTO PARA DECOLAR")
    print("Missão em andamento.")
else:
    print("VEREDITO FINAL: DECOLAGEM ABORTADA")
    print("Missão abortada.")'''
          if old_final not in text:
              raise SystemExit('Bloco de veredito final não encontrado em main.py')
          text = text.replace(old_final, new_final, 1)

          old_report = 'relatorio_cenario.append("VEREDITO FINAL: DECOLAGEM " + decolagem_texto)'
          new_report = '''if decolagem_autorizada:
    relatorio_cenario.append("VEREDITO FINAL: PRONTO PARA DECOLAR")
else:
    relatorio_cenario.append("VEREDITO FINAL: DECOLAGEM ABORTADA")'''
          if old_report not in text:
              raise SystemExit('Bloco de veredito do relatório não encontrado em main.py')
          text = text.replace(old_report, new_report, 1)

          if any(token in text for token in ('painel.py', 'upgrade.md', 'analise_assistida_ia.md')):
              stale = [ln for ln in text.splitlines() if any(t in ln for t in ('painel.py','upgrade.md','analise_assistida_ia.md'))]
              raise SystemExit('Referências antigas restantes: ' + ' | '.join(stale))
          p.write_text(text, encoding='utf-8')

          # Existing scenario text reports
          for q in Path('cenarios').glob('cenario_*.txt'):
              s = q.read_text(encoding='utf-8')
              s = s.replace('VEREDITO FINAL: DECOLAGEM AUTORIZADA', 'VEREDITO FINAL: PRONTO PARA DECOLAR')
              q.write_text(s, encoding='utf-8')

          # Notebook source and saved stream outputs
          nbp = Path('notebook/aurora_pbl.ipynb')
          nb = json.loads(nbp.read_text(encoding='utf-8'))
          replaced = 0
          for cell in nb.get('cells', []):
              if cell.get('cell_type') != 'code':
                  continue
              src = ''.join(cell.get('source', []))
              if old_final in src:
                  src = src.replace(old_final, new_final, 1)
                  cell['source'] = src.splitlines(keepends=True)
                  replaced += 1
              for out in cell.get('outputs', []):
                  if out.get('output_type') == 'stream' and isinstance(out.get('text'), list):
                      new_lines = []
                      for line in out['text']:
                          if line == 'Missão em andamento.\n' and (not new_lines or new_lines[-1] != 'VEREDITO FINAL: PRONTO PARA DECOLAR\n'):
                              new_lines.append('VEREDITO FINAL: PRONTO PARA DECOLAR\n')
                          if line == 'Missão abortada.\n' and (not new_lines or new_lines[-1] != 'VEREDITO FINAL: DECOLAGEM ABORTADA\n'):
                              new_lines.append('VEREDITO FINAL: DECOLAGEM ABORTADA\n')
                          new_lines.append(line)
                      out['text'] = new_lines
          if replaced != 1:
              raise SystemExit(f'Esperado 1 bloco de veredito no notebook; encontrado {replaced}')
          nbp.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')

          # README explicit wording
          rp = Path('README.md')
          r = rp.read_text(encoding='utf-8')
          anchor = '| **HORRÍVEL** | Abortada por falha de segurança ou telemetria não confiável |\n'
          sentence = '\nAo final, além da classificação, o programa imprime literalmente um dos dois vereditos pedidos no enunciado: `VEREDITO FINAL: PRONTO PARA DECOLAR` ou `VEREDITO FINAL: DECOLAGEM ABORTADA`.\n'
          if sentence.strip() not in r:
              if anchor not in r:
                  raise SystemExit('Âncora da tabela de veredito não encontrada no README')
              r = r.replace(anchor, anchor + sentence, 1)
          rp.write_text(r, encoding='utf-8')

          # Scenario 02 screenshot SVG
          sp = Path('docs/terminal_cenario_02_MEDIO.svg')
          s = sp.read_text(encoding='utf-8')
          s = s.replace('height="1810" viewBox="0 0 1120 1810"', 'height="1834" viewBox="0 0 1120 1834"', 1)
          target = '<text x="24" y="1676" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">Missão em andamento.</text>'
          if 'VEREDITO FINAL: PRONTO PARA DECOLAR' not in s:
              if target not in s:
                  raise SystemExit('Linha Missão em andamento não encontrada no SVG 02')
              s = s.replace(target, '<text x="24" y="1676" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">VEREDITO FINAL: PRONTO PARA DECOLAR</text>\n<text x="24" y="1700" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">Missão em andamento.</text>', 1)
              s = s.replace('y="1700" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>', 'y="1724" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>', 1)
              s = s.replace('y="1724" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Cenário registrado', 'y="1748" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Cenário registrado', 1)
              s = s.replace('y="1748" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Planilha acumulada', 'y="1772" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Planilha acumulada', 1)
          sp.write_text(s, encoding='utf-8')

          # Scenario 09 screenshot SVG
          sp = Path('docs/terminal_cenario_09_OTIMO.svg')
          s = sp.read_text(encoding='utf-8')
          s = s.replace('height="1642" viewBox="0 0 1120 1642"', 'height="1666" viewBox="0 0 1120 1666"', 1)
          target = '<text x="24" y="1508" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">Missão em andamento.</text>'
          if 'VEREDITO FINAL: PRONTO PARA DECOLAR' not in s:
              if target not in s:
                  raise SystemExit('Linha Missão em andamento não encontrada no SVG 09')
              s = s.replace(target, '<text x="24" y="1508" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">VEREDITO FINAL: PRONTO PARA DECOLAR</text>\n<text x="24" y="1532" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5fd2bb">Missão em andamento.</text>', 1)
              s = s.replace('y="1532" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>', 'y="1556" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e8e8e8"></text>', 1)
              s = s.replace('y="1556" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Cenário registrado', 'y="1580" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Cenário registrado', 1)
              s = s.replace('y="1580" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Planilha acumulada', 'y="1604" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#bbbbbb">Planilha acumulada', 1)
          sp.write_text(s, encoding='utf-8')

          # Strong assertions
          final = p.read_text(encoding='utf-8')
          assert 'painel.py' not in final
          assert 'upgrade.md' not in final
          assert 'analise_assistida_ia.md' not in final
          assert 'VEREDITO FINAL: PRONTO PARA DECOLAR' in final
          assert 'VEREDITO FINAL: DECOLAGEM ABORTADA' in final
          PY

      - name: Validate
        run: |
          python -m py_compile scripts/main.py
          ! grep -n -E 'painel\.py|upgrade\.md|analise_assistida_ia\.md' scripts/main.py
          grep -n 'VEREDITO FINAL: PRONTO PARA DECOLAR' scripts/main.py
          grep -n 'VEREDITO FINAL: DECOLAGEM ABORTADA' scripts/main.py
          grep -n 'VEREDITO FINAL: PRONTO PARA DECOLAR' notebook/aurora_pbl.ipynb
          grep -n 'VEREDITO FINAL: PRONTO PARA DECOLAR' docs/terminal_cenario_02_MEDIO.svg
          grep -n 'VEREDITO FINAL: PRONTO PARA DECOLAR' docs/terminal_cenario_09_OTIMO.svg

      - name: Commit changes and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-cleanup.yml .github/workflows/final-cleanup-v2.yml
          git add scripts/main.py README.md notebook/aurora_pbl.ipynb cenarios/ docs/ .github/workflows/
          git commit -m "fix: fechar revisão final do PBL Aurora"
          git push origin HEAD:fix/final-10-10
