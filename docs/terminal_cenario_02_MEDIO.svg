<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1664" viewBox="0 0 1140 1664">
<rect width="100%" height="100%" fill="#0b0b0b"/>
<rect width="1140" height="52" fill="#2b2b2b"/>
<text x="24" y="33" fill="#fff" font-size="18" font-family="monospace">python scripts/main.py - cenario 02 (MEDIO)</text>
<text x="24" y="83" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="106" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">EXPEDICAO AURORA - CONTROLE DE MISSAO</text>
<text x="24" y="129" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="152" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Seja bem-vindo a Expedicao Aurora.</text>
<text x="24" y="175" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Identifique-se, capitao: Marcelo</text>
<text x="24" y="198" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="221" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Capitao Marcelo, estamos preparando todas as metricas da nave.</text>
<text x="24" y="244" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Para isso precisamos de algumas informacoes da telemetria.</text>
<text x="24" y="267" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Informe cada valor conforme for pedido. Use ponto para decimais (ex: 22.5).</text>
<text x="24" y="290" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="313" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Digite a temperatura interna: 25.0</text>
<text x="24" y="336" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Digite a temperatura externa: 30.0</text>
<text x="24" y="359" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Digite a pressão dos tanques: 550.0</text>
<text x="24" y="382" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Digite a porcentagem de energia: 80.0</text>
<text x="24" y="405" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Módulos online? (S/N): S</text>
<text x="24" y="428" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="451" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="474" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">TELEMETRIA E DIAGNOSTICO AUTOMATICO</text>
<text x="24" y="497" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="520" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Temperatura interna : 25.0 C</text>
<text x="24" y="543" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Temperatura externa : 30.0 C</text>
<text x="24" y="566" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Integridade calculada: 1 (Preservada no modelo)</text>
<text x="24" y="589" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Diagnostico         : temperaturas e pressão nas faixas seguras; módulos críticos online</text>
<text x="24" y="612" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Pressao dos tanques : 550.0 psi</text>
<text x="24" y="635" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Energia             : 80.0 %</text>
<text x="24" y="658" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Modulos online      : SIM</text>
<text x="24" y="681" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="704" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="727" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">ANALISE ENERGETICA</text>
<text x="24" y="750" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="773" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Capacidade total            : 1000.0 kWh</text>
<text x="24" y="796" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Carga atual                 : 80.0 %</text>
<text x="24" y="819" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Energia disponivel          : 800.0 kWh</text>
<text x="24" y="842" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Perdas energeticas          : 8 %</text>
<text x="24" y="865" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Energia perdida             : 64.0 kWh</text>
<text x="24" y="888" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Energia util                : 736.0 kWh</text>
<text x="24" y="911" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Consumo na decolagem        : 300.0 kWh</text>
<text x="24" y="934" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Energia apos a decolagem    : 436.0 kWh (43.6% da bateria)</text>
<text x="24" y="957" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  Resultado: energia suficiente para a decolagem.</text>
<text x="24" y="980" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="1003" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="1026" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">VERIFICACOES DE SEGURANCA</text>
<text x="24" y="1049" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="1072" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Temperatura Interna: OK</text>
<text x="24" y="1095" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Temperatura Externa: OK</text>
<text x="24" y="1118" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Integridade operacional: Preservada no modelo</text>
<text x="24" y="1141" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Pressão dos Tanques: OK</text>
<text x="24" y="1164" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Energia: OK</text>
<text x="24" y="1187" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Módulos: OK</text>
<text x="24" y="1210" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="1233" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="1256" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">ANÁLISE ASSISTIDA POR IA - DIAGNÓSTICO DE DISCREPÂNCIAS</text>
<text x="24" y="1279" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="1302" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="1325" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">ALERTAS (dados válidos, mas em combinação de risco):</text>
<text x="24" y="1348" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  [!] Energia a 80.0%, no limiar dos 80% exigidos. Não sobra margem para a incerteza do próprio sensor </text>
<text x="24" y="1371" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">(tipicamente +/- 2%).</text>
<text x="24" y="1394" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">  [!] Pressão de 550 psi opera na fronteira da faixa segura (450 a 550 psi).</text>
<text x="24" y="1417" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="1440" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">&gt;&gt; PARECER: DECOLAGEM VIÁVEL, COM RESSALVAS.</text>
<text x="24" y="1463" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">   2 ponto(s) de atenção acima. Recomenda-se revisão humana.</text>
<text x="24" y="1486" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">==============================================================</text>
<text x="24" y="1509" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace"></text>
<text x="24" y="1532" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Decolagem em espera: existem alertas aguardando a decisão do capitão.</text>
<text x="24" y="1555" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Deseja seguir com a decolagem? (s/n): s</text>
<text x="24" y="1578" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Decolagem mantida pelo capitão Marcelo.</text>
<text x="24" y="1601" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">VEREDITO FINAL: PRONTO PARA DECOLAR</text>
<text x="24" y="1624" xml:space="preserve" fill="#e8e8e8" font-size="17" font-family="monospace">Missão em andamento.</text>
</svg>
